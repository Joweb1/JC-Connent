<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Orders</title>
  <link rel="stylesheet" href="./fontawesome/css/all.css">
  <script src="./tailwind.global.js"></script>
  <style type="text/css">
    /* Updated Styles */
    @import url('./lato/lato.css');
    @import url('./Westport Rounded Book/Westport Rounded Book.css');
    
    * {
      font-family: "Westport Rounded Book", "Lato", sans-serif;
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    :root {
      --color-deep: #00004E;
      --color-light: #6880FF;
      --color-success: #22C55E;
      --color-warning: #F59E0B;
      --color-gray: #6B7280;
    }

    body {
      background-color: #f5f5f5;
    }

    /* Header */
    .header {
    display: flex;
    align-items: center;
    background: #fff;
    padding: 1rem 1.5rem;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    gap: 2rem;
    }

    /* Order List */
    .order-list {
      display: grid;
      gap: 1rem;
      padding: 1rem;
      max-width: 800px;
      margin: 0 auto;
    }

    .order-item {
      background: white;
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      gap: 1rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .order-image {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      object-fit: cover;
    }

    .order-info {
      flex-grow: 1;
    }
    .order-info h3{
    	font-weight:700;
    }
    .order-info .am{
    font-weight:700;
    }

    .order-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 500;
    }

    .status-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Order Details Page */
    .timeline {
      display: flex;
      justify-content: space-between;
      padding: 2rem 0;
      position: relative;
      max-width: 600px;
      margin: 0 auto;
    }

    .timeline::before {
      content: '';
      position: absolute;
      top: 30%;
      left: 0;
      right: 0;
      height: 2px;
      background: #E5E7EB;
    }

    .timeline-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
    }

    .step-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.5rem;
      background: #E5E7EB;
      color: white;
    }

    .step-active .step-icon {
      background: var(--color-deep);
    }

    .step-complete .step-icon {
      background: var(--color-success);
    }

    .products-grid {
      display: grid;
      gap: 1rem;
      padding: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .product-card {
      display: flex;
      gap: 1rem;
      padding: 1rem;
      background: white;
      border-radius: 8px;
    }

    .order-summary {
      background: var(--color-deep);
      color:white;
      padding: 1.5rem;
      border-radius: 8px;
      width:100%;
      max-width: 600px;
      margin: 1rem auto;
    }
    
    @media (max-width: 768px) {
    
    	.timeline {
    	justify-content: space-around;
    	margin:auto 35px;
    	}
    	
    	.timeline::before {
    	top: 40%;
    	border-radius:50px;
    	}
    	
    	.timeline-step span {
    		font-size:12px;
    	}
    	
    }
  </style>
</head>
<body>
  <!-- Order List -->
  <header class="header">
    <a href="#" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <div class="page-title">My Orders</div>
  </header>

  <main class="main-content">
    <div class="order-list">
      <div class="order-item">
        <img src="./images/fashion.jpg" class="order-image">
        <div class="order-info">
          <h3>Order #12345</h3>
          <p>2 items </p>
          <p class="am" >$245.00</p>
          <div class="order-status">
            <div class="status-icon shipped"><i class="fas fa-check "></i></div>
            Delivered 15 Jan
          </div>
        </div>
      </div>

      <div class="order-item">
        <img src="./images/household.jpg" class="order-image">
        <div class="order-info">
          <h3>Order #67890</h3>
          <p>3 items</p>
          <p class="am" > $365.00</p>
          <div class="order-status">
            <div class="status-icon pending"><i class="fas fa-shipping-fast"></i></div>
            Shipped - 20 Jan
          </div>
        </div>
      </div>
    </div>

    <!-- Order Details -->
    <div class="order-details" style="display: none;">
      <div class="timeline">
        <div class="timeline-step step-complete">
          <div class="step-icon"><i class="fas fa-check"></i></div>
          <span>Confirmed</span>
        </div>
        <div class="timeline-step step-complete">
          <div class="step-icon"><i class="fas fa-box"></i></div>
          <span>Processing</span>
        </div>
        <div class="timeline-step step-active">
          <div class="step-icon"><i class="fas fa-shipping-fast"></i></div>
          <span>Shipped</span>
        </div>
        <div class="timeline-step">
          <div class="step-icon"><i class="fas fa-home"></i></div>
          <span>Delivered</span>
        </div>
      </div>

      <div class="products-grid">
        <div class="product-card">
          <img src="./images/fashion.jpg" class="order-image">
          <div>
            <h4>Wireless Headphones</h4>
            <p>$199.00 × 1</p>
            <p class="text-gray-600">Electronics</p>
          </div>
        </div>
        <!-- Add 2 more product cards -->

        <div class="order-summary flex gap-3 justify-between">
          <div class="summary-item">
            <span>Subtotal </span> <br>
            <span>$597.00</span>
          </div>
          <div class="summary-item">
            <span>Shipping </span><br>
            <span>$15.00</span>
          </div>
          <div class="summary-item font-bold">
            <span>Total </span><br>
            <span class="text-xl" >$612.00</span>
          </div>
        </div>
      </div>
    </div>
  </main>

<script>
  // Simple view switching logic
  document.querySelectorAll('.order-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelector('.order-list').style.display = 'none';
      document.querySelector('.order-details').style.display = 'block';
      document.querySelector('.page-title').textContent = 'Order Details';
    });
  });

  document.querySelector('.back-btn').addEventListener('click', () => {
    document.querySelector('.order-list').style.display = 'grid';
    document.querySelector('.order-details').style.display = 'none';
    document.querySelector('.page-title').textContent = 'My Orders';
  });
</script>
</body>
</html>
