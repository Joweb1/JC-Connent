<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html lang="en">
<head>
	<meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./fontawesome/css/all.css">
   <!-- <link rel="stylesheet" href="./tailwind.min.css">-->
    <script src="./tailwind.global.js"></script>
<title>JC Connent</title>
<style type="text/css">
	/* Global Reset & Typography */
	@import url('./lato/lato.css');
	@import url('./Westport Rounded Book/Westport Rounded Book.css');
	*{
	font-family:"Westport Rounded Book","Lato", sans-serif;
	/*color:black;*/
	padding:0;
	margin:0;
	}
	:root{
	--color-deep:#00004E;
	--color-light:rgba(104, 128, 255, 1);
	}
	body {
	background-color: #f5f5f5;
	color: #333;
	}
	
	/* Header */
	.header {
	display: flex;
	justify-content: space-between;
	align-items: center;
	background: #fff;
	padding: 1rem 1.5rem;
	box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
	}
	.logo{
		flex-grow:1;
	}
	
	.logo a {
	text-decoration: none;
	font-size: 1.7rem;
	font-weight: bold;
	color: #333;
	text-align:center;
	}
	
	.profile-info {
	display: flex;
	align-items: center;
	justify-content:end;
	gap: 0.5rem;
	font-weight: 500;
	font-size:14px;
	text-align:right;
	}
	
	.profile-info i {
	font-size: 1.8rem;
	color: var(--color-deep);
	text-align:right;
	}
	
	/* Main Content */
	.main-content {
	padding: 1rem;
	}
	

	/* Account Overview */
	.account-overview {
	background: var(--color-deep);
	color:white;
	padding: 1.5rem;
	border-radius: 30px;
	margin-bottom: 1rem;
	box-shadow: 0 2px 5px rgba(0,0,0,0.1);
	}
	
	.user-details {
	display: flex;
	align-items: center;
	gap: 1rem;
	}
	
	.user-image i {
	font-size: 4rem;
	color: var(--color-light);
	}
	.user-info .pmail{
		font-size:13px;
		text-align:center;
	}
	.user-info p:first-child  {
		font-size:22px;
		font-weight:800;
	}
	.user-info p {
		margin-bottom: 0rem;
		font-size:16px;
		font-weight:500;
	}
	
	/* Loyalty Points */
	.loyalty-points {
	margin-bottom: 1rem;
	}
	
	.points-card {
	display: flex;
	align-items: center;
	background: #fff;
	padding: 1rem;
	border-radius: 35px;
	gap: 1rem;
	box-shadow: 0 2px 5px rgba(0,0,0,0.1);
	}
	
	.points-card i {
	font-size: 2rem;
	color: #d4af37; /* gold color */
	}
	
	/* Quick Links */
	.quick-links {
	margin: 2rem 0.5rem;
	
	}
	.quick-links h2{
		margin: 0.rem 0px;
		font-size:18px;
		font-weight:800;
	}
	.links-grid {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
	gap: 1rem;
	background:var(--color-deep);
	padding: 1rem 1rem;
	border-radius:20px;
	}
	
	.quick-link-card {
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	background: #fff;
	padding: 1rem;
	border-radius: 10px;
	text-decoration: none;
	color:var(--color-deep);
	border:1px solid var(--color-deep);
	box-shadow: 0 2px 5px rgba(0,0,0,0.1);
	transition: transform 0.3s, background 0.3s;
	}
	
	.quick-link-card:hover {
	transform: translateY(-5px);
	border:1px solid var(--color-light);
	background:var(--color-deep);
	color: var(--color-light);
	}
	
	.quick-link-card i {
	font-size: 1.5rem;
	margin-bottom: 0.5rem;
	}
	
	.profile-dropdown {
	position: relative;
	cursor: pointer;
	}
	
	.dropdown-menu {
	position: absolute;
	right: 0;
	top: 120%;
	background: white;
	border-radius: 12px;
	box-shadow: 0 8px 24px rgba(0,0,0,0.1);
	width: 200px;
	opacity: 0;
	visibility: hidden;
	transform: translateY(-10px);
	transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
	z-index: 100;
	}
	
	.dropdown-menu.active {
	opacity: 1;
	visibility: visible;
	transform: translateY(0);
	}
	
	.dropdown-menu::before {
	content: '';
	position: absolute;
	bottom: 100%;
	right: 15px;
	border: 8px solid transparent;
	border-bottom-color: white;
	}
	
	.dropdown-item {
	padding: 1rem;
	display: flex;
	align-items: center;
	gap: 1rem;
	color: var(--color-deep);
	text-decoration: none;
	transition: all 0.2s ease;
	}
	
	.dropdown-item:hover {
	background: rgba(104, 128, 255, 0.05);
	padding-left: 1.5rem;
	}
	
	.dropdown-item i {
	font-size:15px;
	width: 20px;
	text-align: center;
	}
	.dropdown-item .badge {
		color:white;
		background:var(--color-deep);
		width:20px;
		height:20px;
		text-align:center;
		border-radius:50%;
	}
	.dropdown-divider {
	height: 1px;
	background: rgba(0,0,0,0.1);
	margin: 0.5rem 0;
	}
	
	@keyframes slideIn {
	0% {
	opacity: 0;
	transform: translateY(-10px);
	}
	100% {
	opacity: 1;
	transform: translateY(0);
	}
	}
</style>
  <!-- Custom CSS 
  <link rel="stylesheet" href="css/style.css" />
  -->
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="logo">
      <a href="#">My Account</a>
    </div>
    <!-- Modified Profile Info Section in Header -->
    <div class="profile-info profile-dropdown" id="profileDropdown">
    <button class="profile-toggle">
    <i class="fa fa-user-circle"></i>
    </button>
    <div class="dropdown-menu">
    <a href="#" class="dropdown-item">
    <i class="fas fa-home"></i>
    <span>Home</span>
    </a>
    <a href="#" class="dropdown-item">
    <i class="fas fa-shopping-cart"></i>
    <span>Cart</span>
    <span class="badge">3</span>
    </a>
    <div class="dropdown-divider"></div>
    <button class="dropdown-item" onclick="handleLogout()">
    <i class="fas fa-sign-out-alt"></i>
    <span>Logout</span>
    </button>
    </div>
    </div>
  </header>
  
  <!-- Main Content -->
  <main class="main-content">
    <section class="account-overview">
      <div class="user-details">
        <div class="user-image">
          <i class="fa fa-user-circle"></i>
        </div>
        <div class="user-info">
          <p>Jonadab</p>
          <p>+1 234 567 890</p>
           <p class="pmail" >codewithmobile00@gmail.com</p>
        </div>
      </div>
    </section>

    <section class="loyalty-points">
      <div class="points-card">
        <i class="fa fa-gem"></i>
        <div>
          <h3>Loyalty Points</h3>
          <p>You have <strong>120</strong> points</p>
        </div>
      </div>
    </section>

    <section class="quick-links">
      <h2>Quick Links</h2>
      <div class="links-grid">
        <a href="orders.html" class="quick-link-card">
          <i class="fa fa-box"></i>
          <span>My Orders</span>
        </a>
        <a href="inbox.html" class="quick-link-card">
          <i class="fa fa-envelope"></i>
          <span>Inbox</span>
        </a>
        <a href="review.html" class="quick-link-card">
          <i class="fa fa-star"></i>
          <span>Reviews</span>
        </a>
        <a href="discount.html" class="quick-link-card">
          <i class="fa fa-tag"></i>
          <span>Discounts</span>
        </a>
        <a href="wishlist.html" class="quick-link-card">
          <i class="fa fa-heart"></i>
          <span>Wishlist</span>
        </a>
        <a href="settings.html" class="quick-link-card">
          <i class="fa fa-cog"></i>
          <span>Settings</span>
        </a>
      </div>
    </section>
  </main>
	<script type="text/javascript">
	const profileDropdown = document.getElementById('profileDropdown');
	const dropdownMenu = profileDropdown.querySelector('.dropdown-menu');
	
	// Toggle dropdown
	profileDropdown.addEventListener('click', (e) => {
	e.stopPropagation();
	dropdownMenu.classList.toggle('active');
	});
	
	// Close dropdown when clicking outside
	document.addEventListener('click', (e) => {
	if (!profileDropdown.contains(e.target)) {
	dropdownMenu.classList.remove('active');
	}
	});
	
	// Logout handler
	function handleLogout() {
	// Add your logout logic here
	console.log('Logging out...');
	dropdownMenu.classList.remove('active');
	window.location.href = '/login';
	}
	
	// Add animation on menu open
	dropdownMenu.addEventListener('transitionend', () => {
	if (dropdownMenu.classList.contains('active')) {
	dropdownMenu.style.animation = 'slideIn 0.3s ease';
	}
	});
	</script>
</body>
</html>
