<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Account Settings</title>
  <link rel="stylesheet" href="./fontawesome/css/all.css">
  <script src="./tailwind.global.js"></script>
  <style type="text/css">
    /* Updated Styles */
    @import url('./lato/lato.css');
    @import url('./Westport Rounded Book/Westport Rounded Book.css');
    
    * {
      font-family: "Westport Rounded Book", "Lato", sans-serif;
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    :root {
      --color-deep: #00004E;
      --color-light: #6880FF;
      --color-success: #22C55E;
      --color-warning: #F59E0B;
      --color-gray: #6B7280;
    }

    body {
      background-color: #f5f5f5;
    }

    .header {
      display: flex;
      align-items: center;
      background: #fff;
      padding: 1rem 1.5rem;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      gap: 2rem;
    }

    .main-content {
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .settings-section {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .section-title {
      font-size: 1.2rem;
      color: var(--color-deep);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--color-gray);
      font-weight: 500;
    }

    .form-control {
      width: 100%;
      padding: 0.8rem;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #f8fafc;
      color: var(--color-deep);
    }

    .form-control:disabled {
      background: #f1f5f9;
      color: #64748b;
    }

    .btn {
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--color-light);
      color: white;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
    }

    .btn-secondary {
      background: var(--color-gray);
      color: white;
    }

    .toggle-switch {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .toggle-icon {
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--color-gray);
    }

    .toggle-icon.active {
      color: var(--color-success);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 1.5rem;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
    }
    
    /* Add these new styles */
    .address-display {
      cursor: pointer;
      transition: background-color 0.2s;
      white-space: pre-line;
    }
    
    .address-display:hover {
      background-color: #f8fafc;
    }
    
    select.form-control {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 0.8rem center;
      background-size: 1em;
    }
    
    .delivery-method-display {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .text-red-500 {
    color: #ef4444;
    }
    
    .text-center {
    text-align: center;
    }
    .delet{
    	font-size:22px;
    	font-weight:700;
    	padding-bottom:5px;
    }
    button.btn{
    	padding:10px 20px;
    	font-size:15px;
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="#" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <div class="page-title">Account Settings</div>
  </header>

  <main class="main-content">
    <!-- Account Details -->
    <div class="settings-section">
      <h3 class="section-title"><i class="fas fa-user-circle"></i>Account Information</h3>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" class="form-control" value="Jonadab" disabled>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-control" value="codewithmobile00@gmail.com" disabled>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" class="form-control" value="+1 234 567 890" disabled>
      </div>
      <button class="btn btn-primary" onclick="showPasswordModal()">
        <i class="fas fa-lock"></i> Change Password
      </button>
    </div>

    <!-- Notifications -->
    <div class="settings-section">
      <h3 class="section-title"><i class="fas fa-bell"></i>Email Notifications</h3>
      <div class="toggle-switch">
        <i class="fas fa-toggle-on toggle-icon active" onclick="toggleNotifications(this)"></i>
        <span>Receive email notifications</span>
      </div>
    </div>

    <!-- Delivery Method -->
    <div class="settings-section">
    <h3 class="section-title"><i class="fas fa-truck"></i>Delivery Method</h3>
    <div class="form-group">
    <select class="form-control" id="deliveryMethod" onchange="updateDeliveryMethod(this)">
    <option value="home">Home Delivery</option>
    <option value="pickup">Store Pickup</option>
    </select>
    </div>
    </div>

    <!-- Address -->
    <div class="settings-section">
      <h3 class="section-title"><i class="fas fa-home"></i>Address</h3>
      <div class="form-group">
        <div class="form-control" onclick="showAddressModal()">
          123 Main Street, Apt 4B
          New York, NY 10001
        </div>
      </div>
    </div>
    
    <!-- New Address Modal -->
    <div id="addressModal" class="modal-overlay">
    <div class="modal-content">
    <h3 class="section-title"><i class="fas fa-edit"></i> Edit Address</h3>
    <div class="form-group">
    <label>Full Name</label>
    <input type="text" class="form-control" id="fullName" value="Jonadab">
    </div>
    <div class="form-group">
    <label>Phone Number</label>
    <input type="tel" class="form-control" id="phone" value="+1 234 567 890">
    </div>
    <div class="form-group">
    <label>Country</label>
    <input type="text" class="form-control" id="country" value="United States">
    </div>
    <div class="form-group">
    <label>State</label>
    <input type="text" class="form-control" id="state" value="New York">
    </div>
    <div class="form-group">
    <label>Home Address</label>
    <textarea class="form-control" id="streetAddress" rows="3">123 Main Street, Apt 4B</textarea>
    </div>
    <button class="btn btn-primary" onclick="saveAddress()">Save Changes</button>
    <button class="btn btn-secondary" onclick="hideModals()">Cancel</button>
    </div>
    </div>
    
    <!--
    <div class="settings-section">
    <h3 class="section-title"><i class="fas fa-home"></i>Address</h3>
    <div class="form-group">
    <div class="form-control address-display" onclick="showAddressModal()">
    123 Main Street, Apt 4B
    New York, NY 10001
    </div>
    </div>
    </div>-->
    

    <!-- Danger Zone -->
    <div class="settings-section">
    <h3 class="section-title"><i class="fas fa-exclamation-triangle"></i>Danger Zone</h3>
    <button class="btn btn-danger" onclick="showDeleteConfirmation()">
    <i class="fas fa-trash"></i> Delete Account
    </button>
    </div>
    <div id="deleteModal" class="modal-overlay">
    <div class="modal-content">
    <div class="text-center">
    <i class="fas fa-exclamation-triangle text-3xl text-red-500 mb-4"></i>
    <h3 class="delet text-center">Delete Account</h3>
    <p class="text-gray-600 mb-6">Are you sure you want to delete your account? This action cannot be undone.</p>
    <div class="flex gap-2 justify-center delet-act">
    <button class="btn btn-danger" onclick="confirmDelete()">
    <i class="fas fa-trash"></i> Delete Account
    </button>
    <button class="btn btn-secondary" onclick="hideModals()">
    Cancel
    </button>
    </div>
    </div>
    </div>
    </div>

    <!-- Logout -->
    <div class="settings-section" style="text-align: center;">
      <button class="btn btn-secondary">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>

    <!-- Modals -->
    <div id="passwordModal" class="modal-overlay">
      <div class="modal-content">
        <h3 class="section-title"><i class="fas fa-lock"></i>Change Password</h3>
        <div class="form-group">
          <label>Current Password</label>
          <input type="password" class="form-control">
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" class="form-control">
        </div>
        <div class="form-group">
          <label>Confirm New Password</label>
          <input type="password" class="form-control">
        </div>
        <button class="btn btn-primary">Update Password</button>
        <button class="btn btn-secondary" onclick="hideModals()">Cancel</button>
      </div>
    </div>

    <!-- Add similar modals for address and delete confirmation -->
  </main>

  <script>
    // Modal Handling
    function showPasswordModal() {
      document.getElementById('passwordModal').style.display = 'flex';
    }

    function hideModals() {
      document.querySelectorAll('.modal-overlay').forEach(modal => {
        modal.style.display = 'none';
      });
    }

    // Toggle Notifications
    function toggleNotifications(icon) {
      icon.classList.toggle('active');
      icon.classList.toggle('fa-toggle-on');
      icon.classList.toggle('fa-toggle-off');
    }

    // Close modal when clicking outside
    window.onclick = function(event) {
      if (event.target.classList.contains('modal-overlay')) {
        hideModals();
      }
    }
	
	// New Address Functions
	function showAddressModal() {
	document.getElementById('addressModal').style.display = 'flex';
	// Populate current values
	document.getElementById('fullName').value = 'Jonadab';
	document.getElementById('phone').value = '+1 234 567 890';
	document.getElementById('country').value = 'United States';
	document.getElementById('state').value = 'New York';
	document.getElementById('streetAddress').value = '123 Main Street, Apt 4B';
	}
	
	function saveAddress() {
	const newAddress = {
	name: document.getElementById('fullName').value,
	phone: document.getElementById('phone').value,
	country: document.getElementById('country').value,
	state: document.getElementById('state').value,
	street: document.getElementById('streetAddress').value
	};
	
	// Update displayed address
	const addressDisplay = document.querySelector('.address-display');
	addressDisplay.innerHTML = `${newAddress.street}\n${newAddress.state}, ${newAddress.country}\n${newAddress.phone}`;
	
	hideModals();
	}
	
	// Delivery Method Function
	function updateDeliveryMethod(select) {
	const method = select.value;
	// You can add additional logic here to handle the delivery method change
	console.log('Delivery method updated to:', method);
	}
    // Add similar functions for other modals
    
    function showDeleteConfirmation() {
    document.getElementById('deleteModal').style.display = 'flex';
    }
    
    function confirmDelete() {
    // Add actual delete functionality here
    console.log('Account deletion confirmed');
    hideModals();
    // Add redirect or account deletion logic here
    }
  </script>
</body>
</html>
